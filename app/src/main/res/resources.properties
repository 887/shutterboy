# R.F.27 — `generateLocaleConfig = true` in app/build.gradle.kts requires
# this file to declare the canonical locale for `values/strings.xml`. Without
# it, AGP can't tell whether the unqualified `values/` resources are English
# (en), German (de), etc.
#
# Reference: https://developer.android.com/r/studio-ui/build/automatic-per-app-languages
unqualifiedResLocale=en-US
